<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Defect Inspection</title>
<script src="config.js"></script>
<style>
  body {
    font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    background: #1e293b;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    padding: 32px;
    max-width: 860px;
    width: 100%;
  }
  h1 { margin: 0 0 4px; font-size: 24px; color: #0f172a; }
  .subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }
  .upload {
    border: 2px dashed #cbd5e1;
    border-radius: 8px;
    padding: 32px;
    text-align: center;
    color: #64748b;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .upload:hover { border-color: #3b82f6; }
  input[type="file"] { display: none; }
  label { font-size: 13px; font-weight: 600; color: #334155; display: block; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 32px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  #status { margin: 16px 0; color: #475569; font-size: 14px; }
  canvas { max-width: 100%; border-radius: 8px; display: none; margin-top: 8px; }
  #summary { font-size: 14px; color: #334155; margin-top: 8px; white-space: pre-line; }
</style>
</head>
<body>
<div class="container">
  <h1>Metal Defect Inspection</h1>
  <div class="subtitle">Amazon Nova 2 Lite による金属部品の欠陥検出</div>

  <div class="upload" id="uploadArea">クリックして検査画像を選択（PNG / JPEG）</div>
  <input type="file" id="fileInput" accept="image/png,image/jpeg">

  <label for="objects">検出する欠陥（カンマ区切り・英語）</label>
  <input type="text" id="objects" value="scratch, dent, rust">

  <button id="detectBtn" disabled>検査する</button>
  <div id="status"></div>
  <canvas id="canvas"></canvas>
  <div id="summary"></div>
</div>

<script>
const COLORS = { scratch: '#ef4444', dent: '#f59e0b', rust: '#8b5cf6' };
const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const detectBtn = document.getElementById('detectBtn');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('canvas');
const summary = document.getElementById('summary');
let image = null;
let imageBase64 = null;
let imageFormat = 'jpeg';

uploadArea.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  imageFormat = file.type === 'image/png' ? 'png' : 'jpeg';
  const reader = new FileReader();
  reader.onload = (ev) => {
    imageBase64 = ev.target.result.split(',')[1];
    image = new Image();
    image.onload = () => {
      drawImage([]);
      detectBtn.disabled = false;
      uploadArea.textContent = file.name;
      summary.textContent = '';
    };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

detectBtn.addEventListener('click', async () => {
  const objects = document.getElementById('objects').value
    .split(',').map(s => s.trim()).filter(Boolean);
  detectBtn.disabled = true;
  statusEl.textContent = 'Nova 2 Lite で解析中...';
  try {
    const res = await fetch(window.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: imageBase64, format: imageFormat, objects }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    render(data);
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = 'エラー: ' + err.message;
  }
  detectBtn.disabled = false;
});

function drawImage(items) {
  canvas.width = image.width;
  canvas.height = image.height;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0);
  const lw = Math.max(2, Math.round((image.width + image.height) / 400));
  ctx.lineWidth = lw;
  ctx.font = `bold ${lw * 6}px sans-serif`;
  for (const { label, box } of items) {
    // 0-1000 の正規化座標をピクセルに変換
    const x1 = box[0] / 1000 * image.width;
    const y1 = box[1] / 1000 * image.height;
    const x2 = box[2] / 1000 * image.width;
    const y2 = box[3] / 1000 * image.height;
    const color = COLORS[label] || '#22c55e';
    ctx.strokeStyle = color;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    ctx.fillStyle = color;
    const th = lw * 7;
    ctx.fillRect(x1, Math.max(0, y1 - th), ctx.measureText(label).width + lw * 4, th);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x1 + lw * 2, Math.max(th - lw, y1 - lw));
  }
}

function render(data) {
  const { labels, boxes } = data.detections;
  drawImage(labels.map((label, i) => ({ label, box: boxes[i] })));
  const counts = {};
  labels.forEach(l => counts[l] = (counts[l] || 0) + 1);
  const lines = Object.entries(counts).map(([l, c]) => `${l}: ${c} 件`);
  summary.textContent = labels.length
    ? `検出結果: ${labels.length} 件\n${lines.join('\n')}`
    : '欠陥は検出されませんでした';
  if (data.usage) {
    summary.textContent += `\n(tokens: in ${data.usage.inputTokens} / out ${data.usage.outputTokens})`;
  }
}
</script>
</body>
</html>
