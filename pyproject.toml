[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mask-tool"
version = "0.3.1"
description = "A tool to mask credentials in sequentially numbered PNG files using Amazon Nova 2 Lite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "furuya02", email = "spw0022@gmail.com" }
]
keywords = ["mask", "redaction", "credentials", "screenshot", "privacy", "cli", "aws", "bedrock", "nova"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "boto3>=1.35.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mask-tool = "mask_tool.main:main"

[project.urls]
Homepage = "https://github.com/furuya02/mask-tool"
Repository = "https://github.com/furuya02/mask-tool"
Issues = "https://github.com/furuya02/mask-tool/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mask_tool"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
